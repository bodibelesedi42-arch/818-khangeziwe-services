<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gallery | 818 Khangeziwe Services</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="gallery-header">
      <h1>Our Gallery</h1>

      <p>
        Browse some of our mobile hire equipment and completed event setups.
      </p>

      <a href="index.html" class="btn"> ← Back to Home </a>
    </header>

    <section class="gallery-page">
      <div class="gallery-grid">
        <figure
          class="gallery-item"
          tabindex="0"
          aria-label="Mobile hire equipment 1"
        >
          <img
            src="assets/images/gallery1.jpg"
            alt="Mobile hire equipment setup 1"
            loading="lazy"
          />
          <figcaption class="caption">
            Event Setup <small>Mobile hire equipment</small>
          </figcaption>
        </figure>

        <figure
          class="gallery-item"
          tabindex="0"
          aria-label="Mobile hire equipment 2"
        >
          <img
            src="assets/images/gallery2.jpg"
            alt="Mobile hire equipment setup 2"
            loading="lazy"
          />
          <figcaption class="caption">
            Corporate Setup <small>Audio & lighting</small>
          </figcaption>
        </figure>

        <figure
          class="gallery-item"
          tabindex="0"
          aria-label="Mobile hire equipment 3"
        >
          <img
            src="assets/images/gallery3.jpg"
            alt="Mobile hire equipment setup 3"
            loading="lazy"
          />
          <figcaption class="caption">
            Wedding Setup <small>Decor & staging</small>
          </figcaption>
        </figure>

        <figure
          class="gallery-item"
          tabindex="0"
          aria-label="Mobile hire equipment 4"
        >
          <img
            src="assets/images/gallery4.jpg"
            alt="Mobile hire equipment setup 4"
            loading="lazy"
          />
          <figcaption class="caption">
            Festival Setup <small>Outdoor rigging</small>
          </figcaption>
        </figure>

        <figure
          class="gallery-item"
          tabindex="0"
          aria-label="Mobile hire equipment 5"
        >
          <img
            src="assets/images/gallery5.jpg"
            alt="Mobile hire equipment setup 5"
            loading="lazy"
          />
          <figcaption class="caption">
            Stage Lighting <small>Dynamic lighting</small>
          </figcaption>
        </figure>

        <figure
          class="gallery-item"
          tabindex="0"
          aria-label="Mobile hire equipment 6"
        >
          <img
            src="assets/images/gallery6.jpg"
            alt="Mobile hire equipment setup 6"
            loading="lazy"
          />
          <figcaption class="caption">
            Event Finishing <small>Final touches</small>
          </figcaption>
        </figure>
      </div>
    </section>

    <script src="script.js"></script>

    <div class="lightbox" id="lightbox">
      <span class="close-lightbox">&times;</span>

      <button class="lightbox-arrow prev-lightbox">&#10094;</button>

      <img id="lightbox-img" src="" alt="Gallery Image" />

      <button class="lightbox-arrow next-lightbox">&#10095;</button>
    </div>
  </body>
</html>
